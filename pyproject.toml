[project]
name = "mailuo"
version = "0.1.0"
description = "Topic-centric Agent Session & Context Manager (脉络 - 针对具体内容与核心主题的 Agent 会话管理系统)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
mai = "mailuo.cli:main"
mailuo = "mailuo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
