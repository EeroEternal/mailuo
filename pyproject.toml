[project]
name = "mailuo"
version = "0.3.2"
description = "mai (Mailuo) — Topic-centric Agent Session & Core Theme Manager for pi.dev & Google Antigravity, backed by multi-tenant Cloudflare D1"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "EeroEternal" }
]
keywords = ["agent", "session", "context", "pi.dev", "antigravity", "cloudflare-d1", "mai", "mailuo"]
dependencies = [
    "rich>=13.7.0",
    "openai>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/EeroEternal/mailuo"
Repository = "https://github.com/EeroEternal/mailuo"

[project.scripts]
mai = "mailuo.cli:main"
mailuo = "mailuo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
